<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo">USK <span>Logistics</span></a>
    <nav class="nav">
      <a href="index.html" data-i18n="nav_home">Главная</a>
      <a href="about.html" data-i18n="nav_about">О нас</a>
      <a href="tariffs.html" data-i18n="nav_tariffs">Тарифы</a>
      <a href="offer.html" data-i18n="nav_offer">Оферта</a>
      <a href="blog.html">Блог</a>
    </nav>
    <div class="lang-switch" role="group" aria-label="Тіл / Язык">
      <button type="button" class="lang-btn" data-lang="kk">ҚАЗ</button>
      <button type="button" class="lang-btn active" data-lang="ru">РУС</button>
      <a href="en/account-login.html" class="lang-btn lang-link">ENG</a>
    </div>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Тёмная тема" title="Тёмная тема">
      <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    <div class="header-cta">
      <span class="press-depth">
        <a href="account-login.html" class="btn btn-primary btn-sm" data-i18n="nav_account">Личный кабинет</a>
      </span>
      <span class="press-depth">
        <a href="contact.html" class="btn btn-outline btn-sm" data-i18n="nav_contact">Связаться</a>
      </span>
    </div>
    <button class="menu-toggle" aria-label="Меню" data-i18n-aria="menu_aria">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main>
  <section class="hero" style="padding: 56px 0 40px;">
    <div class="wrap" style="max-width: 460px;">
      <div class="calc-card" style="margin: 0;" id="login-card">
        <div class="calc-toggle">
          <button type="button" class="calc-option active" id="tab-login" data-i18n="account_tab_login">Вход</button>
          <button type="button" class="calc-option" id="tab-register" data-i18n="account_tab_register">Регистрация</button>
        </div>

        <button type="button" class="btn btn-google" id="google-btn">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 12 24 12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4c-7.7 0-14.3 4.4-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.4l-6.3-5.3C29.4 35 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.6 39.5 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.3 5.3C40.9 36 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
          <span data-i18n="account_google_btn">Войти через Google</span>
        </button>

        <div class="auth-divider" data-i18n="account_or_email">или email</div>

        <div class="calc-input-row" id="register-name-row" hidden>
          <label for="register-name" data-i18n="modal_name_label">Имя</label>
          <input type="text" id="register-name" placeholder="Как к вам обращаться" data-i18n-placeholder="modal_name_placeholder">
        </div>
        <div class="calc-input-row">
          <label for="login-email" data-i18n="account_email_label">Email</label>
          <input type="text" id="login-email" placeholder="you@example.com">
        </div>
        <div class="calc-input-row" id="register-phone-row" hidden>
          <label for="register-phone" data-i18n="account_phone_label">Телефон</label>
          <input type="text" id="register-phone" value="+7 ">
        </div>
        <div class="calc-input-row">
          <label for="login-password" data-i18n="account_password_label">Пароль</label>
          <div class="password-field">
            <input type="password" id="login-password" placeholder="Минимум 6 символов" data-i18n-placeholder="account_password_placeholder">
            <button type="button" class="password-toggle-btn" data-target="login-password" aria-label="Показать пароль"></button>
          </div>
        </div>

        <p id="auth-error" style="color: #dc2626; font-size: 14px; margin: 0 0 16px; display: none;"></p>

        <button type="button" class="btn btn-primary" style="width: 100%;" id="submit-btn" data-i18n="account_login_btn">Войти</button>
      </div>

      <div class="calc-card" style="margin: 0;" id="verify-card" hidden>
        <h2 style="font-size: 20px; margin: 0 0 8px;">Подтвердите email</h2>
        <p style="color: var(--muted); font-size: 14px; margin: 0 0 20px;">Мы отправили 6-значный код на <strong id="verify-email-label"></strong>. Введите его ниже.</p>

        <div class="calc-input-row">
          <label for="verify-code">Код подтверждения</label>
          <input type="text" id="verify-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" style="letter-spacing: 4px; font-size: 20px; text-align: center;">
        </div>

        <p id="verify-error" style="color: #dc2626; font-size: 14px; margin: 0 0 16px; display: none;"></p>
        <p id="verify-info" style="color: #16a34a; font-size: 14px; margin: 0 0 16px; display: none;"></p>

        <button type="button" class="btn btn-primary" style="width: 100%; margin-bottom: 12px;" id="verify-submit-btn">Подтвердить</button>
        <button type="button" class="btn btn-outline" style="width: 100%; margin-bottom: 12px;" id="resend-code-btn">Отправить код ещё раз</button>
        <button type="button" class="btn btn-outline" style="width: 100%;" id="verify-back-btn">Назад</button>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-grid">
    <div class="logo">USK <span>Logistics</span></div>
    <div class="footer-links">
      <a href="about.html" data-i18n="nav_about">О нас</a>
      <a href="tariffs.html" data-i18n="nav_tariffs">Тарифы</a>
      <a href="offer.html" data-i18n="nav_offer">Оферта</a>
      <a href="blog.html">Блог</a>
      <a href="contact.html" data-i18n="nav_contact">Связаться</a>
    </div>
    <div class="copyright" data-i18n="footer_copyright">© 2026 USK Logistics. Все права защищены.</div>
  </div>
</footer>

<script src="assets/i18n.js?v=26"></script>
<script>
  function t(key) {
    var lang = (window.USK_I18N && window.USK_I18N.currentLang) || "ru";
    var dict = (window.USK_I18N && window.USK_I18N.dict[lang]) || {};
    return dict[key] || key;
  }

  var loginTab = document.getElementById("tab-login");
  var registerTab = document.getElementById("tab-register");
  var submitBtn = document.getElementById("submit-btn");
  var registerNameRow = document.getElementById("register-name-row");
  var registerPhoneRow = document.getElementById("register-phone-row");
  var errorEl = document.getElementById("auth-error");
  var isRegister = false;
  var isSubmitting = false;

  function formatPhoneInput(value) {
    var digits = value.replace(/\D/g, "");
    if (digits.charAt(0) === "8") digits = "7" + digits.slice(1);
    if (digits.charAt(0) !== "7") digits = "7" + digits;
    digits = digits.slice(0, 11);
    var rest = digits.slice(1);
    var out = "+7";
    if (rest.length > 0) out += " " + rest.slice(0, 3);
    if (rest.length > 3) out += " " + rest.slice(3, 6);
    if (rest.length > 6) out += " " + rest.slice(6, 8);
    if (rest.length > 8) out += " " + rest.slice(8, 10);
    return out;
  }

  var EYE_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_OFF_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 1 12s4 8 11 8a9.26 9.26 0 0 0 5.39-1.61"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

  document.querySelectorAll(".password-toggle-btn").forEach(function (btn) {
    var input = document.getElementById(btn.dataset.target);
    btn.innerHTML = EYE_ICON;
    btn.addEventListener("click", function () {
      var showing = input.type === "text";
      input.type = showing ? "password" : "text";
      btn.innerHTML = showing ? EYE_ICON : EYE_OFF_ICON;
    });
  });

  var registerPhoneInput = document.getElementById("register-phone");
  registerPhoneInput.addEventListener("input", function () {
    var formatted = formatPhoneInput(registerPhoneInput.value);
    registerPhoneInput.value = formatted;
    registerPhoneInput.setSelectionRange(formatted.length, formatted.length);
  });

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = "block";
  }

  function hideError() {
    errorEl.style.display = "none";
  }

  function refreshSubmitLabel() {
    if (isSubmitting) {
      submitBtn.textContent = t("account_wait_btn");
      return;
    }
    submitBtn.textContent = isRegister ? t("account_register_btn") : t("account_login_btn");
  }

  loginTab.addEventListener("click", function () {
    isRegister = false;
    loginTab.classList.add("active");
    registerTab.classList.remove("active");
    registerNameRow.hidden = true;
    registerPhoneRow.hidden = true;
    refreshSubmitLabel();
    hideError();
  });

  registerTab.addEventListener("click", function () {
    isRegister = true;
    registerTab.classList.add("active");
    loginTab.classList.remove("active");
    registerNameRow.hidden = false;
    registerPhoneRow.hidden = false;
    refreshSubmitLabel();
    hideError();
  });

  document.getElementById("google-btn").addEventListener("click", function () {
    alert(t("account_google_alert"));
  });

  submitBtn.addEventListener("click", function () {
    hideError();
    var email = document.getElementById("login-email").value.trim();
    var password = document.getElementById("login-password").value;

    if (!email || !password) {
      showError(t("account_err_fill_email_password"));
      return;
    }

    var formData = new FormData();
    formData.append("email", email);
    formData.append("password", password);

    var url = "api/login.php";
    if (isRegister) {
      var name = document.getElementById("register-name").value.trim();
      var phone = document.getElementById("register-phone").value.trim();
      if (!name || phone.replace(/\D/g, "").length < 10) {
        showError(t("account_err_fill_name_phone"));
        return;
      }
      formData.append("name", name);
      formData.append("phone", phone);
      url = "api/register.php";
    }

    isSubmitting = true;
    submitBtn.disabled = true;
    refreshSubmitLabel();

    fetch(url, { method: "POST", body: formData })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.needs_verification) {
          showVerifyCard(data.email || email);
        } else if (data.ok) {
          window.location.href = "account-dashboard.html";
        } else {
          showError(data.error ? t(data.error) : t("err_generic"));
        }
      })
      .catch(function () {
        showError(t("err_server_unreachable"));
      })
      .finally(function () {
        isSubmitting = false;
        submitBtn.disabled = false;
        refreshSubmitLabel();
      });
  });

  window.addEventListener("usklangchange", refreshSubmitLabel);

  document.querySelector(".menu-toggle").addEventListener("click", function () {
    document.body.classList.toggle("nav-open");
  });

  var loginCard = document.getElementById("login-card");
  var verifyCard = document.getElementById("verify-card");
  var verifyEmailLabel = document.getElementById("verify-email-label");
  var verifyCodeInput = document.getElementById("verify-code");
  var verifyError = document.getElementById("verify-error");
  var verifyInfo = document.getElementById("verify-info");
  var verifySubmitBtn = document.getElementById("verify-submit-btn");
  var resendBtn = document.getElementById("resend-code-btn");
  var verifyBackBtn = document.getElementById("verify-back-btn");

  var verifyErrorMessages = {
    invalid_code: "Неверный код. Попробуйте ещё раз.",
    code_expired: "Код истёк. Запросите новый ниже.",
    not_pending: "Сессия подтверждения истекла. Войдите заново.",
    too_many_attempts: "Слишком много попыток. Попробуйте позже.",
    already_verified: "Email уже подтверждён."
  };

  function showVerifyCard(email) {
    loginCard.hidden = true;
    verifyCard.hidden = false;
    verifyEmailLabel.textContent = email || "";
    verifyError.style.display = "none";
    verifyInfo.style.display = "none";
    verifyCodeInput.value = "";
    verifyCodeInput.focus();
  }

  function showVerifyError(msg) {
    verifyError.textContent = msg;
    verifyError.style.display = "block";
    verifyInfo.style.display = "none";
  }

  function showVerifyInfo(msg) {
    verifyInfo.textContent = msg;
    verifyInfo.style.display = "block";
    verifyError.style.display = "none";
  }

  verifySubmitBtn.addEventListener("click", function () {
    var code = verifyCodeInput.value.trim();
    if (!code) {
      showVerifyError("Введите код из письма.");
      return;
    }

    verifySubmitBtn.disabled = true;
    verifySubmitBtn.textContent = t("account_wait_btn");

    var formData = new FormData();
    formData.append("code", code);

    fetch("api/verify-email.php", { method: "POST", body: formData })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok) {
          window.location.href = "account-dashboard.html";
        } else {
          showVerifyError(verifyErrorMessages[data.error] || "Что-то пошло не так. Попробуйте ещё раз.");
        }
      })
      .catch(function () {
        showVerifyError(t("err_server_unreachable"));
      })
      .finally(function () {
        verifySubmitBtn.disabled = false;
        verifySubmitBtn.textContent = "Подтвердить";
      });
  });

  resendBtn.addEventListener("click", function () {
    resendBtn.disabled = true;
    resendBtn.textContent = "Отправка...";

    fetch("api/resend-code.php", { method: "POST" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok) {
          showVerifyInfo("Новый код отправлен на почту.");
        } else {
          showVerifyError(verifyErrorMessages[data.error] || "Не получилось отправить код. Попробуйте позже.");
        }
      })
      .catch(function () {
        showVerifyError(t("err_server_unreachable"));
      })
      .finally(function () {
        resendBtn.disabled = false;
        resendBtn.textContent = "Отправить код ещё раз";
      });
  });

  verifyBackBtn.addEventListener("click", function () {
    verifyCard.hidden = true;
    loginCard.hidden = false;
  });
</script>
</body>
</html>
