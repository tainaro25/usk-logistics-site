<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель - USK Logistics</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=25">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo">USK <span>Logistics</span></a>
    <span class="admin-badge">Админ-панель</span>
  </div>
</header>

<main>
  <section style="padding: 40px 0 80px;">
    <div class="wrap">
      <p id="access-message" style="color: var(--muted);">Проверка доступа...</p>

      <div class="account-layout" id="admin-layout" hidden>
        <aside class="account-sidebar">
          <nav class="account-nav">
            <a href="#" class="tab-link active" data-tab="orders"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.73Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg> Все заказы</a>
            <a href="#" class="tab-link" data-tab="create"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Создать заказ</a>
            <a href="#" class="tab-link" data-tab="requests"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Заявки</a>
            <a href="#" class="tab-link" data-tab="users"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Пользователи</a>
          </nav>
        </aside>

        <div class="account-panel">
          <div class="tab-content" id="tab-orders">
            <h1>Все заказы</h1>
            <div id="admin-orders-list"></div>
          </div>

          <div class="tab-content" id="tab-create" hidden>
            <h1>Создать заказ</h1>
            <div class="calc-input-row" style="position: relative;">
              <label for="new-order-user-search">Клиент</label>
              <input type="text" id="new-order-user-search" placeholder="Начните вводить имя или email..." autocomplete="off">
              <input type="hidden" id="new-order-user-id">
              <div id="new-order-user-suggestions" class="user-suggestions" hidden></div>
            </div>
            <div class="calc-input-row">
              <label for="new-order-track">Трек-номер</label>
              <input type="text" id="new-order-track" placeholder="Например, KZ4471829563US">
            </div>
            <div class="calc-input-row">
              <label for="new-order-desc">Товар</label>
              <input type="text" id="new-order-desc" placeholder="Например, Кроссовки Nike Air Max">
            </div>
            <div class="calc-input-row">
              <label>Откуда</label>
              <div class="calc-toggle" id="new-order-origin-toggle">
                <button type="button" class="calc-option active" data-value="США">США</button>
                <button type="button" class="calc-option" data-value="Европа">Европа</button>
                <button type="button" class="calc-option" data-value="Китай">Китай</button>
                <button type="button" class="calc-option" data-value="Китай Экспресс">Китай Экспресс</button>
              </div>
            </div>
            <div class="calc-input-row">
              <label>Статус</label>
              <div class="calc-toggle" id="new-order-status-toggle">
                <button type="button" class="calc-option active" data-value="на рассмотрении">на рассмотрении</button>
                <button type="button" class="calc-option" data-value="выкуплен">выкуплен</button>
                <button type="button" class="calc-option" data-value="на складе">на складе</button>
                <button type="button" class="calc-option" data-value="в пути">в пути</button>
                <button type="button" class="calc-option" data-value="доставлено">доставлено</button>
              </div>
            </div>
            <p id="create-message" style="font-size: 14px; margin: 0 0 16px; display: none;"></p>
            <button type="button" class="btn btn-primary" id="create-order-btn">Создать заказ</button>
          </div>

          <div class="tab-content" id="tab-requests" hidden>
            <h1>Заявки клиентов</h1>
            <div id="admin-requests-list"></div>
          </div>

          <div class="tab-content" id="tab-users" hidden>
            <h1>Пользователи</h1>
            <div id="admin-users-list"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
<script>
  var ORDER_STATUSES_ADMIN = ["на рассмотрении", "выкуплен", "на складе", "в пути", "доставлено"];
  var ORDER_STATUSES_CUSTOMER = ["сформировано", "на складе", "в пути", "прибыл", "доставлено"];
  var BUYOUT_STATUSES = ["в обработке", "одобрена", "отклонена"];
  var ORIGIN_OPTIONS = ["США", "Европа", "Китай", "Китай Экспресс"];

  var statusClass = {
    "на рассмотрении": "status-transit",
    "выкуплен": "status-transit",
    "сформировано": "status-pending",
    "на складе": "status-warehouse",
    "в пути": "status-transit",
    "прибыл": "status-arrived",
    "доставлено": "status-delivered",
    "в обработке": "status-transit",
    "одобрена": "status-approved",
    "отклонена": "status-rejected"
  };

  function formatDate(isoString) {
    var d = new Date(isoString.replace(" ", "T"));
    return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
  }

  function toDateInputValue(isoString) {
    if (!isoString) return "";
    return isoString.slice(0, 10);
  }

  function toDateTimeInputValue(isoString) {
    if (!isoString) return "";
    return isoString.replace(" ", "T").slice(0, 16);
  }

  function dateToInternalValue(date) {
    if (!date) return "";
    var pad = function (n) { return String(n).padStart(2, "0"); };
    return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()) + "T" + pad(date.getHours()) + ":" + pad(date.getMinutes());
  }

  function nowForDateTimeInput() {
    return dateToInternalValue(new Date());
  }

  function parseInternalValue(v) {
    if (!v) return null;
    var d = new Date(v.replace(" ", "T"));
    return isNaN(d.getTime()) ? null : d;
  }

  function formatDateTime(isoString) {
    var d = new Date(isoString.replace(" ", "T"));
    var day = String(d.getDate()).padStart(2, "0");
    var month = String(d.getMonth() + 1).padStart(2, "0");
    var hours = String(d.getHours()).padStart(2, "0");
    var minutes = String(d.getMinutes()).padStart(2, "0");
    return day + "." + month + "." + d.getFullYear() + ", " + hours + ":" + minutes;
  }

  function truncateForDisplay(str, maxLen) {
    if (!str) return "";
    if (str.length <= maxLen) return str;
    return str.slice(0, maxLen) + "...";
  }

  function attachCopyHandlers(box) {
    box.querySelectorAll(".copy-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var text = btn.dataset.copy;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(function () {
            btn.textContent = "✓";
            setTimeout(function () { btn.textContent = "⧉"; }, 1500);
          });
        }
      });
    });
  }

  function esc(value) {
    var div = document.createElement("div");
    div.textContent = value === null || value === undefined ? "" : String(value);
    return div.innerHTML;
  }

  function formatUserId(id) {
    return "#" + String(id).padStart(4, "0");
  }

  var CSRF_TOKEN = "";
  function csrfHeaders() {
    return { "X-CSRF-Token": CSRF_TOKEN };
  }

  function selectOptions(list, selected) {
    return list.map(function (s) {
      return '<option value="' + s + '"' + (s === selected ? " selected" : "") + '>' + s + "</option>";
    }).join("");
  }

  document.querySelectorAll(".tab-link").forEach(function (link) {
    link.addEventListener("click", function (e) {
      e.preventDefault();
      document.querySelectorAll(".tab-link").forEach(function (l) { l.classList.remove("active"); });
      link.classList.add("active");
      var target = link.dataset.tab;
      document.querySelectorAll(".tab-content").forEach(function (p) {
        p.hidden = p.id !== "tab-" + target;
      });
    });
  });

  var ORIGIN_RATES = { "США": 12, "Европа": 12, "Китай": 6, "Китай Экспресс": 12 };

  function calcPayment(origin, weight) {
    var rate = ORIGIN_RATES[origin];
    var w = parseFloat(weight);
    if (!rate || isNaN(w) || w <= 0) return null;
    return (w * rate).toFixed(2);
  }

  var orderHistoryState = {};

  function loadOrders() {
    fetch("api/admin-orders.php")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.ok) return;
        var box = document.getElementById("admin-orders-list");
        if (!data.orders.length) {
          box.innerHTML = '<p style="color: var(--muted); font-size: 14px;">Заказов пока нет.</p>';
          return;
        }
        box.innerHTML = data.orders.map(function (o) {
          var statusList = o.source === "customer" ? ORDER_STATUSES_CUSTOMER : ORDER_STATUSES_ADMIN;
          var history = o.status_history || {};
          orderHistoryState[o.id] = {};
          statusList.forEach(function (s) {
            orderHistoryState[o.id][s] = toDateTimeInputValue(history[s]);
          });
          return '' +
            '<div class="order-card">' +
              '<div class="order-card-header">' +
                '<h3>Заказ №' + o.id + '</h3>' +
                '<span class="status-badge ' + (statusClass[o.status] || "status-transit") + '">' + esc(o.status) + '</span>' +
              '</div>' +
              '<div class="order-card-details" style="margin-bottom: 16px;">' +
                '<div class="detail-item"><span class="detail-label">Клиент</span><span class="detail-value">' + formatUserId(o.user_id) + ' · ' + esc(o.user_name) + ' (' + esc(o.user_email) + ')</span></div>' +
                '<div class="detail-item"><span class="detail-label">Добавлен</span><span class="detail-value">' + (o.source === "customer" ? "самим клиентом" : "администратором") + '</span></div>' +
              '</div>' +
              '<div class="admin-edit-grid">' +
                '<div class="calc-input-row"><label>Трек-номер</label><input type="text" class="edit-track" data-order-id="' + o.id + '" value="' + esc(o.track_number) + '"></div>' +
                '<div class="calc-input-row"><label>Товар</label><input type="text" class="edit-desc" data-order-id="' + o.id + '" value="' + esc(o.description || "") + '"></div>' +
                '<div class="calc-input-row"><label>Откуда</label><select class="edit-origin" data-order-id="' + o.id + '">' + selectOptions(ORIGIN_OPTIONS, o.origin) + '</select></div>' +
                '<div class="calc-input-row"><label>Дата создания</label><input type="date" class="edit-created" data-order-id="' + o.id + '" value="' + toDateInputValue(o.created_at) + '"></div>' +
                '<div class="calc-input-row"><label>Вес (кг)</label><input type="number" step="0.01" min="0" class="edit-weight" data-order-id="' + o.id + '" value="' + (o.weight !== null && o.weight !== undefined ? esc(o.weight) : "") + '"></div>' +
                '<div class="calc-input-row"><label>Сумма платежа ($)</label><input type="number" step="0.01" min="0" class="edit-payment" data-order-id="' + o.id + '" value="' + (o.payment_amount !== null && o.payment_amount !== undefined ? esc(o.payment_amount) : "") + '"></div>' +
                '<div class="calc-input-row"><label>Статус</label><select class="edit-status" data-order-id="' + o.id + '" data-prev-status="' + esc(o.status) + '">' + selectOptions(statusList, o.status) + '</select></div>' +
                '<div class="calc-input-row"><label>Когда наступил статус</label><div style="display:flex; gap:8px;"><input type="text" class="edit-status-when" data-order-id="' + o.id + '" placeholder="дд.мм.гггг чч:мм" style="flex:1;" autocomplete="off"><button type="button" class="btn btn-outline btn-sm set-now-btn" data-order-id="' + o.id + '" style="flex-shrink:0;">Сейчас</button></div></div>' +
              '</div>' +
              '<div style="display:flex; gap:10px; margin-top:12px;">' +
                '<button type="button" class="btn btn-primary btn-sm save-order-btn" data-order-id="' + o.id + '">Сохранить</button>' +
                '<button type="button" class="btn btn-outline btn-sm delete-order-btn" data-order-id="' + o.id + '" style="color:#dc2626; border-color:#dc2626;">Удалить</button>' +
              '</div>' +
            '</div>';
        }).join("");

        box.querySelectorAll(".edit-status-when").forEach(function (input) {
          var orderId = input.dataset.orderId;
          var currentStatus = box.querySelector('.edit-status[data-order-id="' + orderId + '"]').value;
          flatpickr(input, {
            enableTime: true,
            time_24hr: true,
            dateFormat: "d.m.Y H:i",
            allowInput: true,
            defaultDate: parseInternalValue(orderHistoryState[orderId][currentStatus])
          });
        });

        box.querySelectorAll(".edit-status").forEach(function (select) {
          select.addEventListener("change", function () {
            var orderId = select.dataset.orderId;
            var oldStatus = select.dataset.prevStatus;
            var newStatus = select.value;
            var whenInput = box.querySelector('.edit-status-when[data-order-id="' + orderId + '"]');
            var fp = whenInput._flatpickr;
            if (fp) {
              var currentDate = fp.selectedDates[0] || null;
              orderHistoryState[orderId][oldStatus] = currentDate ? dateToInternalValue(currentDate) : "";
              var stored = orderHistoryState[orderId][newStatus];
              fp.setDate(stored ? parseInternalValue(stored) : null, false);
            }
            select.dataset.prevStatus = newStatus;
          });
        });

        box.querySelectorAll(".set-now-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var orderId = btn.dataset.orderId;
            var whenInput = box.querySelector('.edit-status-when[data-order-id="' + orderId + '"]');
            var fp = whenInput._flatpickr;
            if (fp) fp.setDate(new Date(), true);
          });
        });

        box.querySelectorAll(".edit-weight").forEach(function (input) {
          input.addEventListener("input", function () {
            var orderId = input.dataset.orderId;
            var originSelect = box.querySelector('.edit-origin[data-order-id="' + orderId + '"]');
            var paymentInput = box.querySelector('.edit-payment[data-order-id="' + orderId + '"]');
            var val = calcPayment(originSelect.value, input.value);
            if (val !== null) paymentInput.value = val;
          });
        });

        box.querySelectorAll(".edit-origin").forEach(function (select) {
          select.addEventListener("change", function () {
            var orderId = select.dataset.orderId;
            var weightInput = box.querySelector('.edit-weight[data-order-id="' + orderId + '"]');
            var paymentInput = box.querySelector('.edit-payment[data-order-id="' + orderId + '"]');
            var val = calcPayment(select.value, weightInput.value);
            if (val !== null) paymentInput.value = val;
          });
        });

        box.querySelectorAll(".save-order-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var orderId = btn.dataset.orderId;
            var track = box.querySelector('.edit-track[data-order-id="' + orderId + '"]').value.trim();
            var desc = box.querySelector('.edit-desc[data-order-id="' + orderId + '"]').value.trim();
            var origin = box.querySelector('.edit-origin[data-order-id="' + orderId + '"]').value;
            var createdDate = box.querySelector('.edit-created[data-order-id="' + orderId + '"]').value;
            var weight = box.querySelector('.edit-weight[data-order-id="' + orderId + '"]').value.trim();
            var payment = box.querySelector('.edit-payment[data-order-id="' + orderId + '"]').value.trim();
            var status = box.querySelector('.edit-status[data-order-id="' + orderId + '"]').value;

            var whenInput = box.querySelector('.edit-status-when[data-order-id="' + orderId + '"]');
            var fp = whenInput._flatpickr;
            var currentDate = fp ? (fp.selectedDates[0] || null) : null;
            orderHistoryState[orderId][status] = currentDate ? dateToInternalValue(currentDate) : "";
            var history = orderHistoryState[orderId] || {};

            btn.disabled = true;
            btn.textContent = "...";
            var formData = new FormData();
            formData.append("order_id", orderId);
            formData.append("track_number", track);
            formData.append("description", desc);
            formData.append("origin", origin);
            formData.append("status", status);
            formData.append("weight", weight);
            formData.append("payment_amount", payment);
            formData.append("created_at", createdDate);
            formData.append("history", JSON.stringify(history));
            fetch("api/admin-update-order.php", { method: "POST", headers: csrfHeaders(), body: formData })
              .then(function (r) { return r.json(); })
              .then(function (data) {
                btn.textContent = data.ok ? "Сохранено" : (data.error === "track_number_taken" ? "Трек занят" : "Ошибка");
                if (data.ok) loadOrders();
              })
              .finally(function () {
                setTimeout(function () { btn.disabled = false; btn.textContent = "Сохранить"; }, 1200);
              });
          });
        });

        box.querySelectorAll(".delete-order-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            if (!confirm("Удалить этот заказ безвозвратно?")) return;
            var orderId = btn.dataset.orderId;
            var formData = new FormData();
            formData.append("order_id", orderId);
            btn.disabled = true;
            fetch("api/admin-delete-order.php", { method: "POST", headers: csrfHeaders(), body: formData })
              .then(function (r) { return r.json(); })
              .then(function (data) {
                if (data.ok) loadOrders();
                else btn.disabled = false;
              });
          });
        });
      });
  }

  var allUsers = [];

  function loadUsersIntoSelect() {
    fetch("api/admin-users.php")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.ok) return;
        allUsers = data.users;
      });
  }

  var userSearchInput = document.getElementById("new-order-user-search");
  var userIdField = document.getElementById("new-order-user-id");
  var userSuggestionsBox = document.getElementById("new-order-user-suggestions");

  userSearchInput.addEventListener("input", function () {
    userIdField.value = "";
    var query = userSearchInput.value.trim().toLowerCase();
    if (!query) {
      userSuggestionsBox.hidden = true;
      return;
    }
    var idQuery = query.replace(/[^0-9]/g, "");
    var matches = allUsers.filter(function (u) {
      return u.name.toLowerCase().indexOf(query) !== -1 ||
        u.email.toLowerCase().indexOf(query) !== -1 ||
        (u.phone || "").toLowerCase().replace(/\s/g, "").indexOf(query.replace(/\s/g, "")) !== -1 ||
        (idQuery !== "" && (String(u.id).indexOf(idQuery) !== -1 || String(u.id).padStart(4, "0").indexOf(idQuery) !== -1));
    }).slice(0, 8);

    if (!matches.length) {
      userSuggestionsBox.innerHTML = '<div class="user-suggestion-empty">Никого не найдено</div>';
      userSuggestionsBox.hidden = false;
      return;
    }

    userSuggestionsBox.innerHTML = matches.map(function (u) {
      return '<div class="user-suggestion-item" data-user-id="' + u.id + '" data-user-label="' + esc(u.name + " (" + u.email + ")") + '">' +
        '<strong>' + formatUserId(u.id) + ' · ' + esc(u.name) + '</strong><span>' + esc(u.email) + (u.phone ? " · " + esc(u.phone) : "") + '</span></div>';
    }).join("");
    userSuggestionsBox.hidden = false;

    userSuggestionsBox.querySelectorAll(".user-suggestion-item").forEach(function (item) {
      item.addEventListener("click", function () {
        userIdField.value = item.dataset.userId;
        userSearchInput.value = item.dataset.userLabel;
        userSuggestionsBox.hidden = true;
      });
    });
  });

  document.addEventListener("click", function (e) {
    if (e.target !== userSearchInput && !userSuggestionsBox.contains(e.target)) {
      userSuggestionsBox.hidden = true;
    }
  });

  var selectedOrigin = "США";
  document.getElementById("new-order-origin-toggle").addEventListener("click", function (e) {
    var btn = e.target.closest(".calc-option");
    if (!btn) return;
    this.querySelectorAll(".calc-option").forEach(function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    selectedOrigin = btn.dataset.value;
  });

  var selectedNewOrderStatus = "на рассмотрении";
  document.getElementById("new-order-status-toggle").addEventListener("click", function (e) {
    var btn = e.target.closest(".calc-option");
    if (!btn) return;
    this.querySelectorAll(".calc-option").forEach(function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    selectedNewOrderStatus = btn.dataset.value;
  });

  function loadBuyouts() {
    fetch("api/admin-buyouts.php")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.ok) return;
        var box = document.getElementById("admin-requests-list");
        if (!data.buyouts.length) {
          box.innerHTML = '<p style="color: var(--muted); font-size: 14px;">Заявок пока нет.</p>';
          return;
        }
        box.innerHTML = data.buyouts.map(function (b) {
          var accountInfo = b.user_id
            ? formatUserId(b.user_id) + " · " + esc(b.user_name || "") + " (" + esc(b.user_email || "") + ")"
            : "Гость (без аккаунта)";
          var link = b.product_link || "";
          var linkHtml = link
            ? '<span class="link-text" title="' + esc(link) + '">' + esc(truncateForDisplay(link, 32)) + '</span>' +
              '<button type="button" class="copy-btn" data-copy="' + esc(link) + '" title="Скопировать">⧉</button>'
            : "-";
          return '' +
            '<div class="order-card">' +
              '<div class="order-card-header">' +
                '<h3>' + esc(b.name) + '</h3>' +
                '<span class="status-badge ' + (statusClass[b.status] || "status-transit") + '">' + esc(b.status) + '</span>' +
              '</div>' +
              '<div class="order-card-details">' +
                '<div class="detail-item"><span class="detail-label">Телефон</span><span class="detail-value">' + esc(b.phone) + '</span></div>' +
                '<div class="detail-item"><span class="detail-label">Ссылка на товар</span><span class="detail-value">' + linkHtml + '</span></div>' +
                '<div class="detail-item"><span class="detail-label">Аккаунт</span><span class="detail-value">' + accountInfo + '</span></div>' +
                '<div class="detail-item"><span class="detail-label">Дата и время</span><span class="detail-value">' + formatDateTime(b.created_at) + '</span></div>' +
              '</div>' +
              '<div class="calc-input-row" style="margin: 16px 0 0;">' +
                '<label>Сменить статус</label>' +
                '<div style="display:flex; gap:10px;">' +
                  '<select class="buyout-status-select" data-buyout-id="' + b.id + '" style="flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--border);">' + selectOptions(BUYOUT_STATUSES, b.status) + '</select>' +
                  '<button type="button" class="btn btn-outline btn-sm save-buyout-status" data-buyout-id="' + b.id + '">Сохранить</button>' +
                  '<button type="button" class="btn btn-outline btn-sm delete-buyout-btn" data-buyout-id="' + b.id + '" style="color:#dc2626; border-color:#dc2626;">Удалить</button>' +
                '</div>' +
              '</div>' +
            '</div>';
        }).join("");

        attachCopyHandlers(box);

        box.querySelectorAll(".save-buyout-status").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var buyoutId = btn.dataset.buyoutId;
            var select = box.querySelector('.buyout-status-select[data-buyout-id="' + buyoutId + '"]');
            btn.disabled = true;
            btn.textContent = "...";
            var formData = new FormData();
            formData.append("buyout_id", buyoutId);
            formData.append("status", select.value);
            fetch("api/admin-update-buyout.php", { method: "POST", headers: csrfHeaders(), body: formData })
              .then(function (r) { return r.json(); })
              .then(function (data) {
                btn.textContent = data.ok ? "Сохранено" : "Ошибка";
              })
              .finally(function () {
                setTimeout(function () { btn.disabled = false; btn.textContent = "Сохранить"; }, 1200);
              });
          });
        });

        box.querySelectorAll(".delete-buyout-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            if (!confirm("Удалить эту заявку безвозвратно?")) return;
            var buyoutId = btn.dataset.buyoutId;
            var formData = new FormData();
            formData.append("buyout_id", buyoutId);
            btn.disabled = true;
            fetch("api/admin-delete-buyout.php", { method: "POST", headers: csrfHeaders(), body: formData })
              .then(function (r) { return r.json(); })
              .then(function (data) {
                if (data.ok) loadBuyouts();
                else btn.disabled = false;
              });
          });
        });
      });
  }

  function loadUsersList() {
    fetch("api/admin-users.php")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.ok) return;
        var box = document.getElementById("admin-users-list");
        if (!data.users.length) {
          box.innerHTML = '<p style="color: var(--muted); font-size: 14px;">Пользователей пока нет.</p>';
          return;
        }
        box.innerHTML = data.users.map(function (u) {
          return '' +
            '<div class="order-card">' +
              '<div class="order-card-header">' +
                '<h3>' + formatUserId(u.id) + ' · ' + esc(u.name) + '</h3>' +
                '<button type="button" class="btn btn-outline btn-sm delete-user-btn" data-user-id="' + u.id + '" style="color:#dc2626; border-color:#dc2626;">Удалить профиль</button>' +
              '</div>' +
              '<div class="order-card-details">' +
                '<div class="detail-item"><span class="detail-label">Email</span><span class="detail-value">' + esc(u.email) + '</span></div>' +
                '<div class="detail-item"><span class="detail-label">Телефон</span><span class="detail-value">' + esc(u.phone || "-") + '</span></div>' +
              '</div>' +
            '</div>';
        }).join("");

        box.querySelectorAll(".delete-user-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            if (!confirm("Удалить этот профиль? Вместе с ним удалятся и все его заказы. Это необратимо.")) return;
            var userId = btn.dataset.userId;
            var formData = new FormData();
            formData.append("user_id", userId);
            btn.disabled = true;
            fetch("api/admin-delete-user.php", { method: "POST", headers: csrfHeaders(), body: formData })
              .then(function (r) { return r.json(); })
              .then(function (data) {
                if (data.ok) {
                  loadUsersList();
                  loadUsersIntoSelect();
                  loadOrders();
                } else {
                  btn.disabled = false;
                  alert(data.error === "cannot_delete_self" ? "Нельзя удалить самого себя." : "Не получилось удалить.");
                }
              });
          });
        });
      });
  }

  document.getElementById("create-order-btn").addEventListener("click", function () {
    var btn = this;
    var msg = document.getElementById("create-message");
    var userId = document.getElementById("new-order-user-id").value;
    var track = document.getElementById("new-order-track").value.trim();
    var desc = document.getElementById("new-order-desc").value.trim();
    var origin = selectedOrigin;
    var status = selectedNewOrderStatus;

    if (!userId || !track) {
      msg.style.color = "#dc2626";
      msg.textContent = "Выберите клиента и укажите трек-номер.";
      msg.style.display = "block";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Создание...";

    var formData = new FormData();
    formData.append("user_id", userId);
    formData.append("track_number", track);
    formData.append("description", desc);
    formData.append("origin", origin);
    formData.append("status", status);

    fetch("api/admin-create-order.php", { method: "POST", headers: csrfHeaders(), body: formData })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok) {
          msg.style.color = "#16a34a";
          msg.textContent = "Заказ создан.";
          document.getElementById("new-order-track").value = "";
          document.getElementById("new-order-desc").value = "";
          userSearchInput.value = "";
          userIdField.value = "";
          loadOrders();
        } else if (data.error === "track_number_taken") {
          msg.style.color = "#dc2626";
          msg.textContent = "Такой трек-номер уже используется.";
        } else {
          msg.style.color = "#dc2626";
          msg.textContent = "Не получилось создать заказ.";
        }
        msg.style.display = "block";
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = "Создать заказ";
      });
  });

  fetch("api/admin-check.php")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data.ok) {
        document.getElementById("access-message").textContent = "Доступ только для администраторов.";
        return;
      }
      CSRF_TOKEN = data.csrf || "";
      document.getElementById("access-message").hidden = true;
      document.getElementById("admin-layout").hidden = false;
      loadOrders();
      loadUsersIntoSelect();
      loadBuyouts();
      loadUsersList();
    })
    .catch(function () {
      document.getElementById("access-message").textContent = "Не удалось связаться с сервером.";
    });
</script>
</body>
</html>
